<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Confirmed - Integrated Derm of North Raleigh</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <a class="logo" href="index.html">
      <span class="brand-main">INTEGRATED</span>
      <span class="brand-main">DERMATOLOGY</span>
      <span class="brand-sub">OF NORTH RALEIGH</span>
    </a>
    <div class="practice-name">Integrated Derm of North Raleigh</div>
  </div>

  <div class="steps">
    <div class="step done">
      <span class="step-circle">&#10003;</span>
      <span class="step-label">Choose Provider</span>
    </div>
    <div class="step-line done"></div>
    <div class="step done">
      <span class="step-circle">&#10003;</span>
      <span class="step-label">Select Time</span>
    </div>
    <div class="step-line done"></div>
    <div class="step done">
      <span class="step-circle">&#10003;</span>
      <span class="step-label">Confirm Details</span>
    </div>
    <div class="step-line done"></div>
    <div class="step active">
      <span class="step-circle">4</span>
      <span class="step-label">Complete</span>
    </div>
  </div>

  <button class="login-btn">Log in</button>
</header>

<div class="page-shell">
  <div class="content-wrap">
    <div class="card complete-card">
      <div class="complete-icon">&#10003;</div>
      <div class="complete-title">Appointment Confirmed</div>
      <div class="complete-subtitle">This step has not been designed yet. Placeholder pending reference screenshot.</div>
    </div>
  </div>
</div>

</html>
